<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 청룡챔피언스리그</title>
<style>
  :root {
    --navy: #0a1628;
    --blue: #1a3c8f;
    --sky: #3b6fd4;
    --gold: #f5a623;
    --green: #22c55e;
    --red: #ef4444;
    --gray: #64748b;
    --border: #dde3f5;
    --bg: #f0f4ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: var(--bg); color: #222; }
  .main-header {
    background: linear-gradient(135deg, var(--navy), var(--blue), var(--sky));
    color: white; padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 18px rgba(10,22,40,0.5);
  }
  .logo { display: flex; align-items: center; gap: 14px; }
  .emblem {
    width: 54px; height: 54px; background: var(--gold);
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 1.8rem;
    box-shadow: 0 0 0 4px rgba(245,166,35,0.3);
  }
  .main-header h1 { font-size: 1.5rem; font-weight: 900; }
  .main-header .sub { font-size: 0.82rem; opacity: 0.75; margin-top: 3px; }
  .event-badge {
    background: var(--gold); color: #000; font-size: 0.8rem;
    font-weight: 800; padding: 6px 16px; border-radius: 20px;
  }
  .grade-tabs {
    display: flex; background: var(--navy); padding: 0 32px; gap: 4px;
  }
  .grade-tab {
    padding: 14px 28px; border: none; cursor: pointer;
    font-size: 1rem; font-weight: 700; color: rgba(255,255,255,0.5);
    background: transparent; border-bottom: 3px solid transparent;
    transition: 0.2s;
  }
  .grade-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .grade-tab:hover:not(.active) { color: white; }
  .sub-nav {
    background: white; display: flex; flex-wrap: wrap;
    border-bottom: 2px solid var(--border); padding: 0 24px; gap: 2px;
  }
  .sub-tab {
    padding: 12px 20px; border: none; background: none;
    font-size: 0.9rem; cursor: pointer; color: var(--gray);
    border-bottom: 3px solid transparent; transition: 0.2s;
  }
  .sub-tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }
  .sub-tab:hover:not(.active) { color: var(--blue); background: #f0f4ff; }
  .container { max-width: 1100px; margin: 28px auto; padding: 0 20px; }
  .section { display: none; }
  .section.active { display: block; }
  .card {
    background: white; border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    padding: 24px; margin-bottom: 22px;
  }
  .card h2 {
    font-size: 1.05rem; color: var(--blue); margin-bottom: 18px;
    border-left: 4px solid var(--gold); padding-left: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 130px; }
  label { font-size: 0.8rem; color: var(--gray); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  input, select, textarea {
    padding: 9px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 0.93rem; outline: none;
    font-family: inherit; transition: 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,60,143,0.1); }
  textarea { resize: vertical; min-height: 70px; }
  .btn {
    padding: 9px 20px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 0.92rem; font-weight: 700;
    transition: 0.2s; font-family: inherit;
  }
  .btn-primary { background: var(--blue); color: white; }
  .btn-primary:hover { background: var(--sky); transform: translateY(-1px); }
  .btn-sm { padding: 6px 14px; font-size: 0.83rem; }
  .btn-danger {
    background: #fee2e2; color: var(--red);
    border: 1px solid #fecaca; font-size: 0.78rem;
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  .btn-danger:hover { background: #fecaca; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  thead th {
    background: var(--blue); color: white; padding: 11px 10px;
    text-align: center; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px;
  }
  thead th:nth-child(2) { text-align: left; padding-left: 14px; }
  tbody td { padding: 11px 10px; text-align: center; border-bottom: 1px solid #f0f4ff; }
  tbody td:nth-child(2) { text-align: left; padding-left: 14px; font-weight: 600; }
  tbody tr:hover { background: #f8f9ff; }
  .rank-badge {
    display: inline-flex; width: 26px; height: 26px; border-radius: 50%;
    align-items: center; justify-content: center; font-weight: 800; font-size: 0.82rem;
  }
  .r1 { background: #fef3c7; color: #d97706; }
  .r2 { background: #f1f5f9; color: #475569; }
  .r3 { background: #fef9ef; color: #b45309; }
  .rn { background: #f8fafc; color: var(--gray); }
  .pts { font-weight: 800; color: var(--blue); font-size: 1rem; }
  .w { color: var(--green); font-weight: 700; }
  .d { color: var(--gold); font-weight: 600; }
  .l { color: var(--red); font-weight: 600; }
  .match-card {
    background: #f8faff; border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px; margin-bottom: 10px;
  }
  .match-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .match-round-badge {
    background: var(--blue); color: white; font-size: 0.75rem;
    font-weight: 700; padding: 3px 10px; border-radius: 12px;
  }
  .match-group-badge {
    background: var(--gold); color: #000; font-size: 0.75rem;
    font-weight: 700; padding: 3px 10px; border-radius: 12px;
  }
  .match-date-text { font-size: 0.8rem; color: var(--gray); }
  .match-body { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .match-team { font-weight: 700; font-size: 1rem; flex: 1; }
  .match-team.home { text-align: right; }
  .match-team.away { text-align: left; }
  .match-score {
    background: var(--navy); color: white;
    font-size: 1.3rem; font-weight: 900;
    padding: 8px 20px; border-radius: 10px; min-width: 90px; text-align: center;
  }
  .match-meta { font-size: 0.78rem; color: var(--gray); margin-top: 8px; display: flex; gap: 16px; flex-wrap: wrap; }
  .match-meta span { display: flex; align-items: center; gap: 4px; }
  .match-footer { display: flex; justify-content: flex-end; margin-top: 8px; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 14px; margin-bottom: 22px; }
  .stat-card {
    background: white; border-radius: 12px; padding: 18px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 4px solid var(--blue);
  }
  .stat-card.gold { border-top-color: var(--gold); }
  .stat-card.green { border-top-color: var(--green); }
  .stat-val { font-size: 2rem; font-weight: 800; color: var(--navy); }
  .stat-lbl { font-size: 0.78rem; color: var(--gray); margin-top: 4px; }
  .person-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: #e8eeff; color: var(--blue);
    padding: 6px 14px; border-radius: 20px; font-size: 0.87rem; font-weight: 600;
    margin: 4px;
  }
  .chip-remove {
    background: none; border: none; cursor: pointer;
    color: var(--red); font-size: 1rem; font-weight: 900; padding: 0;
  }
  .person-section { display: flex; gap: 20px; flex-wrap: wrap; }
  .person-box { flex: 1; min-width: 240px; }
  .person-box h3 { font-size: 0.9rem; color: var(--gray); font-weight: 700; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 999;
    background: var(--navy); color: white; padding: 12px 22px;
    border-radius: 10px; font-size: 0.9rem; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    transform: translateY(80px); opacity: 0; transition: all 0.3s; pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .filter-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .filter-row select, .filter-row input {
    padding: 8px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 0.87rem; outline: none;
  }
  .empty { text-align: center; padding: 40px; color: #aaa; }
  .empty .ei { font-size: 2.5rem; margin-bottom: 10px; }
  @media(max-width:600px){
    .main-header { flex-direction: column; gap: 12px; align-items: flex-start; }
    .match-body { flex-direction: column; }
    .match-team { text-align: left !important; }
    .person-section { flex-direction: column; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<header class="main-header">
  <div class="logo">
    <div class="emblem">🐉</div>
    <div>
      <div class="sub">행사명</div>
      <h1>2026 청룡챔피언스리그</h1>
      <div class="sub">교내 학년별 축구 리그 통합 관리 시스템</div>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:10px;">
    <div class="event-badge">⚽ 2026 시즌</div>
    <button
      type="button"
      class="btn btn-sm"
      style="background:#f1f5f9; color:#111827; border-radius:999px; border:none; cursor:pointer;"
      onclick="onAdminLoginClick(event)"
    >
      🔐 관리자 로그인
    </button>
  </div>
</header>
<div class="grade-tabs">
  <button class="grade-tab active" onclick="switchGrade(1, this)">🔵 1학년 리그</button>
  <button class="grade-tab" onclick="switchGrade(2, this)">🔴 2학년 리그</button>
</div>
<nav class="sub-nav">
  <button class="sub-tab active" onclick="showSection('dashboard')">📊 대시보드</button>
  <button class="sub-tab" onclick="showSection('match-input')">✏️ 경기 입력</button>
  <button class="sub-tab" onclick="showSection('standings')">🏆 순위표</button>
  <button class="sub-tab" onclick="showSection('results')">📋 경기 기록</button>
  <button class="sub-tab" onclick="showSection('teams')">👥 팀 관리</button>
  <button class="sub-tab" onclick="showSection('staff')">🦺 운영진·심판</button>
  <button class="sub-tab" onclick="showSection('topscorer')">⚽ 득점왕</button>
  <button class="sub-tab" onclick="showSection('finals')">🏆 본선경기</button>
</nav>
<div class="container">
  <div id="sec-dashboard" class="section active">
    <div class="stat-row" id="stat-row"></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
      <div class="card">
        <h2>🕐 최근 경기</h2>
        <div id="recent-matches"></div>
      </div>
      <div class="card">
        <h2>🥇 상위 순위</h2>
        <div id="top-teams"></div>
      </div>
    </div>
  </div>
  <div id="sec-match-input" class="section">
    <div class="card">
      <h2>✏️ 경기 결과 입력</h2>
      <div class="form-row">
        <div class="form-group" style="max-width:130px;">
  <label>경기 단계</label>
  <select id="inp-stage" onchange="updateSelects()">
    <option value="group">조별리그</option>
    <option value="final">본선진출전</option>
  </select>
</div>
        <div class="form-group" style="max-width:80px;">
          <label>조</label>
          <input type="text" id="inp-group" placeholder="A, B…">
        </div>
        <div class="form-group" style="max-width:110px;">
          <label>경기번호</label>
          <input type="text" id="inp-num" placeholder="1, 2…">
        </div>
        <div class="form-group">
          <label>경기 일정</label>
          <input type="datetime-local" id="inp-date">
        </div>
      </div>
      <div class="form-row" style="align-items:center;">
        <div class="form-group">
          <label>HOME 팀</label>
          <select id="inp-home"><option value="">팀 선택</option></select>
        </div>
        <div class="form-group" style="max-width:80px;">
          <label>HOME 점수</label>
          <input type="number" id="inp-hscore" min="0" value="0">
        </div>
        <div style="padding-bottom:4px; font-size:1.4rem; font-weight:900; color:#aaa;">:</div>
        <div class="form-group" style="max-width:80px;">
          <label>AWAY 점수</label>
          <input type="number" id="inp-ascore" min="0" value="0">
        </div>
        <div class="form-group">
          <label>AWAY 팀</label>
          <select id="inp-away"><option value="">팀 선택</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group" style="max-width:90px;">
          <label>HOME 교체 수</label>
          <input type="number" id="inp-hsub" min="0" max="5" value="0">
        </div>
        <div class="form-group" style="max-width:90px;">
          <label>AWAY 교체 수</label>
          <input type="number" id="inp-asub" min="0" max="5" value="0">
        </div>
        <div class="form-group">
          <label>운영진</label>
          <input type="text" id="inp-staff" placeholder="이름 입력">
        </div>
        <div class="form-group">
          <label>주심</label>
          <input type="text" id="inp-ref" placeholder="이름 입력">
        </div>
        <div class="form-group">
          <label>부심 (쉼표 구분)</label>
          <input type="text" id="inp-ref2" placeholder="이름1, 이름2">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>득점 선수 및 기타사항</label>
          <textarea id="inp-note" placeholder="득점 선수, 특이사항 등 입력(예: 2반: 박지혜(2) )"></textarea>
        </div>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary" onclick="addMatch()">💾 결과 저장</button>
        <button class="btn btn-sm" style="background:#f1f5f9; color:var(--gray);" onclick="resetMatchForm()">초기화</button>
      </div>
    </div>
  </div>
  <div id="sec-standings" class="section">
    <div class="card">
      <h2>🏆 조별 순위표</h2>
      <div style="display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
        <select id="filter-group-standing" onchange="renderStandings()" style="padding:7px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:0.87rem; outline:none;">
          <option value="">전체 조</option>
        </select>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>순위</th><th>팀명</th><th>조</th><th>경기</th>
              <th>승</th><th>무</th><th>패</th>
              <th>득점</th><th>실점</th><th>득실</th><th>승점</th>
            </tr>
          </thead>
          <tbody id="standings-body"></tbody>
        </table>
      </div>
      <p style="font-size:0.78rem;color:var(--gray);margin-top:10px;">※ 승 3점 / 무 1점 / 패 0점 기준</p>
    </div>
  </div>
  <div id="sec-results" class="section">
    <div class="card">
      <h2>📋 전체 경기 기록</h2>
      <div class="filter-row">
        <select id="filter-group" onchange="renderResults()">
          <option value="">전체 조</option>
        </select>
        <input type="text" id="filter-team-text" placeholder="팀명 검색..." oninput="renderResults()" style="min-width:150px;">
        <button class="btn btn-sm" style="background:#f1f5f9;color:var(--gray);" onclick="clearFilter()">필터 초기화</button>
        <span style="margin-left:auto;font-size:0.85rem;color:var(--gray);">총 <strong id="result-count">0</strong>경기</span>
      </div>
      <div id="results-list"></div>
    </div>
  </div>
  <div id="sec-teams" class="section">
     <div class="card admin-only">
    <div class="form-row">
      <div class="form-group">
        <label>엑셀로 팀 명단 업로드 (조 / 팀이름)</label>
        <input type="file" id="team-upload-file" accept=".xlsx,.xls,.csv">
      </div>
      <button class="btn btn-sm" style="align-self:flex-end;" onclick="importTeamsFromExcel()">엑셀에서 불러오기</button>
    </div>
  </div>
    <div class="card">
      <h2>👥 팀 등록</h2>
      <div class="form-row">
        <div class="form-group">
          <label>팀 이름</label>
          <input type="text" id="new-team-name" placeholder="예) 1-1반, 청팀 등" onkeydown="if(event.key==='Enter')addTeam()">
        </div>
        <div class="form-group" style="max-width:80px;">
          <label>조</label>
          <input type="text" id="new-team-group" placeholder="A, B…">
        </div>
        <div class="form-group" style="max-width:100px;">
          <label>팀 색상</label>
          <input type="color" id="new-team-color" value="#1a3c8f" style="padding:4px;height:40px;">
        </div>
        <button class="btn btn-primary" onclick="addTeam()" style="align-self:flex-end;">팀 추가</button>
      </div>
      <div id="team-list" style="margin-top:14px;"></div>
    </div>
  </div>
     <div id="sec-staff" class="section">
        <div id="excel-upload-wrapper">
      <hr style="margin:16px 0; border:none; border-top:1px dashed #e5e7eb;">
        <div class="card">
      <h2>🦺 운영진 · 심판 명단</h2>
      <div class="form-row" style="margin-bottom:20px;">
        <div class="form-group">
          <label>이름</label>
          <input type="text" id="new-person-name" placeholder="이름 입력" onkeydown="if(event.key==='Enter')addPerson()">
        </div>
        <div class="form-group" style="max-width:160px;">
          <label>역할</label>
          <select id="new-person-role">
            <option value="operator">운영진</option>
            <option value="referee">주심</option>
            <option value="assistant">부심</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="addPerson()" style="align-self:flex-end;">추가</button>
      </div>
      <div class="person-section">
        <div class="person-box">
          <h3>🏅 운영진</h3>
          <div id="list-operator"></div>
        </div>
        <div class="person-box">
          <h3>🟡 주심</h3>
          <div id="list-referee"></div>
        </div>
        <div class="person-box">
          <h3>🟠 부심</h3>
          <div id="list-assistant"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="sec-topscorer" class="section">
  <div class="card">
    <h2>⚽ 득점왕 / 득점 통계</h2>
    <div class="filter-row">
      <select id="filter-group-topscorer" onchange="renderTopScorer()">
        <option value="">전체 조</option>
      </select>
    </div>
    <div id="topscorer-list"></div>
  </div>
</div>
<div id="sec-finals" class="section">
  <div class="card">
    <h2>🏆 본선 진출팀 (조 1위)</h2>
    <div id="finals-qualified-list"></div>
  </div>
  <div class="card">
    <h2>📋 본선 경기 기록</h2>
    <div id="finals-results-list"></div>
  </div>
  <div class="card">
    <h2>🥇 본선 순위표</h2>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>순위</th><th>팀명</th><th>조(예선)</th><th>경기</th>
            <th>승</th><th>무</th><th>패</th>
            <th>득점</th><th>실점</th><th>득실</th><th>승점</th>
          </tr>
        </thead>
        <tbody id="finals-standings-body"></tbody>
      </table>
    </div>
  </div>
</div>  
<div class="toast" id="toast"></div>
<script>
/* ===== 백엔드 연결 설정 (★ 여기 URL을 본인 것으로 교체하세요!) ===== */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJi-8X7OrjtNJ8-H2MkUeK5dS5hqAqtk4OPTijWb-PXwYormS55pIJdybIAA6mi6DC/exec';

/* ===== 전역 상태 ===== */
let currentGrade = 1;
let editingMatchId = null;
const ADMIN_PASSWORD = '2026';
let stateCache = {}; // 학년별 데이터 캐시: { 1: {...}, 2: {...} }

/* ===== 공통 상태 (서버 연동) ===== */
function getState() {
  return stateCache[currentGrade] || { teams: [], matches: [], staff: [] };
}
function setState(s) {
  stateCache[currentGrade] = s;
  saveStateToServer(currentGrade, s);
}
async function loadStateFromServer(grade) {
  try {
    const res = await fetch(`${SCRIPT_URL}?key=chungryong_g${grade}`);
    const data = await res.json();
    if (data && !data.error) {
      stateCache[grade] = {
        teams: data.teams || [],
        matches: data.matches || [],
        staff: data.staff || []
      };
    } else {
      stateCache[grade] = { teams: [], matches: [], staff: [] };
    }
  } catch (err) {
    console.error('데이터 로드 실패:', err);
    stateCache[grade] = stateCache[grade] || { teams: [], matches: [], staff: [] };
    toast('⚠️ 서버 연결 실패. 인터넷 상태를 확인해 주세요.');
  }
}
async function saveStateToServer(grade, state) {
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: `chungryong_g${grade}`, value: state })
    });
  } catch (err) {
    console.error('저장 실패:', err);
    toast('⚠️ 서버 저장 실패. 다시 시도해 주세요.');
  }
}

/* ===== 관리자 모드 ===== */
function isAdmin() {
  return localStorage.getItem('chungryong_admin') === 'true';
}
function setAdmin(flag) {
  if (flag) localStorage.setItem('chungryong_admin', 'true');
  else localStorage.removeItem('chungryong_admin');
  updateAdminUI();
  updateAdminButton();
}
function ensureAdmin() {
  if (isAdmin()) return true;
  const pwd = prompt('관리자 비밀번호를 입력하세요.');
  if (pwd === ADMIN_PASSWORD) {
    setAdmin(true);
    toast('관리자 모드로 전환되었습니다.');
    return true;
  } else {
    toast('비밀번호가 올바르지 않습니다.');
    return false;
  }
}
function updateAdminButton() {
  const btn = document.querySelector('button[onclick*="onAdminLoginClick"]');
  if (!btn) return;
  if (isAdmin()) {
    btn.textContent = '🔓 관리자 로그아웃';
    btn.style.background = '#fee2e2';
    btn.style.color = '#b91c1c';
  } else {
    btn.textContent = '🔐 관리자 로그인';
    btn.style.background = '#f1f5f9';
    btn.style.color = '#111827';
  }
}
function updateAdminUI() {
  const matchCard = document.querySelector('#sec-match-input .card');
  if (matchCard) {
    if (isAdmin()) {
      matchCard.style.opacity = '1';
      matchCard.style.pointerEvents = 'auto';
      const info = matchCard.querySelector('.admin-info');
      if (info) info.remove();
    } else {
      matchCard.style.opacity = '0.4';
      matchCard.style.pointerEvents = 'none';
      if (!matchCard.querySelector('.admin-info')) {
        const div = document.createElement('div');
        div.className = 'admin-info';
        div.style.marginBottom = '10px';
        div.style.color = 'var(--red)';
        div.style.fontSize = '0.85rem';
        div.textContent = '※ 관리자만 경기 입력 및 수정이 가능합니다. 상단의 [관리자 로그인] 버튼을 사용해 주세요.';
        matchCard.insertBefore(div, matchCard.firstChild);
      }
    }
  }

  const teamCard = document.querySelector('#sec-teams .card'); /* 참고: 원래 셀렉터도 잘못됐던 부분 (아래 설명) */
  if (teamCard) {
    if (isAdmin()) {
      teamCard.style.opacity = '1';
      teamCard.style.pointerEvents = 'auto';
      const info = teamCard.querySelector('.admin-info');
      if (info) info.remove();
    } else {
      teamCard.style.opacity = '0.4';
      teamCard.style.pointerEvents = 'none';
      if (!teamCard.querySelector('.admin-info')) {
        const div = document.createElement('div');
        div.className = 'admin-info';
        div.style.marginBottom = '10px';
        div.style.color = 'var(--red)';
        div.style.fontSize = '0.85rem';
        div.textContent = '※ 관리자만 팀 등록/삭제가 가능합니다. 상단의 [관리자 로그인] 버튼을 사용해 주세요.';
        teamCard.insertBefore(div, teamCard.firstChild);
      }
    }
  }

  const excelWrap = document.getElementById('excel-upload-wrapper');
  if (excelWrap) {
    excelWrap.style.display = isAdmin() ? 'block' : 'none';
  }
}

function onAdminLoginClick(e) {
  e.stopPropagation();
  if (isAdmin()) {
    if (confirm('관리자 모드를 종료하시겠습니까?')) {
      setAdmin(false);
      toast('관리자 모드가 해제되었습니다.');
    }
  } else {
    ensureAdmin();
  }
}
/* ===== 학년 전환 & 섹션 전환 ===== */
async function switchGrade(grade, el) {
  currentGrade = grade;
  document.querySelectorAll('.grade-tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');

  if (!stateCache[grade]) {
    toast('⏳ 데이터를 불러오는 중...');
    await loadStateFromServer(grade);
  }

  renderAll();
  updateSelects();
  showSection('dashboard');
  document.querySelectorAll('.sub-tab').forEach((b, i) => b.classList.toggle('active', i === 0));
}
function showSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const sec = document.getElementById('sec-' + name);
  if (sec) sec.classList.add('active');
  document.querySelectorAll('.sub-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.sub-tab').forEach(btn => {
    const onclick = btn.getAttribute('onclick') || '';
    if (onclick.includes("'" + name + "'")) btn.classList.add('active');
  });
  if (name === 'dashboard')   renderDashboard();
  if (name === 'standings')   { renderStandings(); updateGroupFilter('filter-group-standing'); }
  if (name === 'results')     { renderResults(); updateGroupFilter('filter-group'); updateSelects(); }
  if (name === 'teams')       renderTeams();
  if (name === 'staff')       renderStaff();
  if (name === 'match-input') updateSelects();
  if (name === 'topscorer')   { updateTopScorerGroupFilter(); renderTopScorer(); }
  if (name === 'finals')     renderFinals(); 
}

/* ===== 토스트 ===== */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ===== 팀 관리 ===== */
function addTeam() {
  if (!isAdmin()) return toast('⚠️ 관리자만 팀을 등록할 수 있습니다.');
  
  const s = getState();
  const name = document.getElementById('new-team-name').value.trim();
  const group = document.getElementById('new-team-group').value.trim().toUpperCase();
  const color = document.getElementById('new-team-color').value;
  if (!name) return toast('팀 이름을 입력해 주세요.');
  if (s.teams.find(t => t.name === name)) return toast('이미 존재하는 팀입니다.');
  s.teams.push({ id: Date.now(), name, group, color });
  setState(s);
  document.getElementById('new-team-name').value = '';
  document.getElementById('new-team-group').value = '';
  renderTeams(); updateSelects();
  toast('✅ ' + name + ' 팀이 등록되었습니다!');
}

function removeTeam(id) {
  if (!isAdmin()) return toast('⚠️ 관리자만 팀을 삭제할 수 있습니다.');
  
  if (!confirm('팀을 삭제하면 해당 팀의 경기 기록도 삭제됩니다.')) return;
  const s = getState();
  s.teams = s.teams.filter(t => t.id !== id);
  s.matches = s.matches.filter(m => m.homeId !== id && m.awayId !== id);
  setState(s); renderTeams(); updateSelects();
  toast('🗑️ 팀이 삭제되었습니다.');
}
function renderTeams() {
  const s = getState();
  const el = document.getElementById('team-list');
  if (!s.teams.length) { el.innerHTML = '<div class="empty"><div class="ei">👥</div>등록된 팀이 없습니다.</div>'; return; }
  const grouped = {};
  s.teams.forEach(t => { const g = t.group || '미지정'; if (!grouped[g]) grouped[g] = []; grouped[g].push(t); });
  el.innerHTML = Object.entries(grouped).map(([g, ts]) => `
    <div style="margin-bottom:14px;">
      <div style="font-size:0.8rem;color:var(--gray);font-weight:700;margin-bottom:6px;text-transform:uppercase;">${g}조</div>
      <div>${ts.map(t => `
        <span class="person-chip" style="background:#e8eeff;">
          <span style="width:10px;height:10px;border-radius:50%;background:${t.color};display:inline-block;"></span>
          ${t.name}
          <button class="chip-remove" onclick="removeTeam(${t.id})">✕</button>
        </span>`).join('')}</div>
    </div>`).join('');
}

/* ===== 엑셀에서 팀 명단 가져오기 ===== */
function importTeamsFromExcel() {
  if (!isAdmin() && !ensureAdmin()) return;
  const input = document.getElementById('team-upload-file');
  if (!input || !input.files || !input.files[0]) {
    toast('엑셀 파일을 먼저 선택해 주세요.');
    return;
  }
  const file = input.files[0];
  if (typeof XLSX === 'undefined') {
    console.error('XLSX 라이브러리가 로드되지 않았습니다.');
    toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 스크립트 경로를 확인해 주세요.');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
        toast('엑셀 파일에 시트가 없습니다.');
        return;
      }
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      if (!sheet) {
        toast('엑셀 시트를 읽지 못했습니다.');
        return;
      }
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      if (!rows || !rows.length) {
        toast('시트에 데이터가 없습니다.');
        return;
      }
      const s = getState();
      const newTeams = [];
      rows.slice(1).forEach((row, idx) => {
        if (!row || row.length < 2) return;
        const groupRaw = (row[0] || '').toString().trim();
        const nameRaw  = (row[1] || '').toString().trim();
        if (!nameRaw) return;
        const group = groupRaw.toUpperCase();
        const name  = nameRaw;
        if (s.teams.find(t => t.name === name)) return;
        newTeams.push({
          id: Date.now() + idx,
          name,
          group,
          color: '#1a3c8f'
        });
      });
      if (!newTeams.length) {
        toast('추가할 팀 데이터가 없습니다. 엑셀 형식을 다시 확인해 주세요.');
        return;
      }
      s.teams = s.teams.concat(newTeams);
      setState(s);
      renderTeams();
      updateSelects();
      updateGroupFilter('filter-group-standing');
      updateGroupFilter('filter-group');
      updateTopScorerGroupFilter();
      toast(`✅ ${currentGrade}학년 리그에 엑셀에서 ${newTeams.length}개 팀을 불러왔습니다.`);
    } catch (err) {
      console.error('엑셀 파싱 에러:', err);
      toast('엑셀 파일을 처리하는 중 오류가 발생했습니다.');
    }
  };
  reader.onerror = function(err) {
    console.error('FileReader 에러:', err);
    toast('엑셀 파일을 읽는 중 오류가 발생했습니다.');
  };
  reader.readAsArrayBuffer(file);
}

/* ===== 셀렉트/필터 ===== */
function updateSelects() {
  const s = getState();
  const stageSel = document.getElementById('inp-stage');
  const stage = stageSel ? stageSel.value : 'group';
  let teamPool = s.teams;
  if (stage === 'final') {
    const qualifiedIds = new Set(getQualifiedTeams().map(t => t.id));
    teamPool = s.teams.filter(t => qualifiedIds.has(t.id));
  }
  ['inp-home','inp-away'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const cur = sel.value;
    sel.innerHTML = '<option value="">팀 선택</option>' + teamPool.map(t =>
      `<option value="${t.id}">${t.group ? '['+t.group+'조] ' : ''}${t.name}</option>`).join('');
    sel.value = cur;
  });
}
function updateGroupFilter(id) {
  const s = getState();
  const groups = [...new Set(s.teams.map(t => t.group).filter(Boolean))].sort();
  const sel = document.getElementById(id);
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '<option value="">전체 조</option>' + groups.map(g =>
    `<option value="${g}">${g}조</option>`).join('');
  sel.value = cur;
}

/* ===== 경기 추가/수정 ===== */
function addMatch() {
  if (!isAdmin() && !ensureAdmin()) return;
  const s = getState();
  const homeId = parseInt(document.getElementById('inp-home').value);
  const awayId = parseInt(document.getElementById('inp-away').value);
  if (!homeId || !awayId) return toast('홈팀과 원정팀을 선택해 주세요.');
  if (homeId === awayId) return toast('같은 팀끼리는 경기할 수 없습니다.');
  const hs = parseInt(document.getElementById('inp-hscore').value) || 0;
  const as = parseInt(document.getElementById('inp-ascore').value) || 0;
  const noteText = document.getElementById('inp-note').value.trim();
  const scorers = [];
  if (noteText) {
    noteText.split('\n').forEach(line => {
      const row = line.trim();
      if (!row) return;
      const idx = row.indexOf(':');
      if (idx === -1) return;
      const team = row.slice(0, idx).trim();
      const rest = row.slice(idx + 1).trim();
      if (!rest) return;
      rest.split(',').forEach(part => {
        const txt = part.trim();
        const m = txt.match(/^(.+)\(([0-9]+)\)$/);
        if (m) {
          scorers.push({
            name: m[1].trim(),
            team: team,
            goals: parseInt(m[2], 10)
          });
        }
      });
    });
  }
  const matchData = {
    group: document.getElementById('inp-group').value.trim().toUpperCase(),
    num: document.getElementById('inp-num').value.trim(),
    date: document.getElementById('inp-date').value,
    stage: document.getElementById('inp-stage')?.value || 'group', 
    homeId, awayId, hs, as,
    hsub: parseInt(document.getElementById('inp-hsub').value) || 0,
    asub: parseInt(document.getElementById('inp-asub').value) || 0,
    staff: document.getElementById('inp-staff').value.trim(),
    ref: document.getElementById('inp-ref').value.trim(),
    ref2: document.getElementById('inp-ref2').value.trim(),
    note: noteText,
    scorers
  };
  if (editingMatchId) {
    const idx = s.matches.findIndex(m => m.id === editingMatchId);
    if (idx !== -1) {
      matchData.id = editingMatchId;
      s.matches[idx] = matchData;
      toast('✅ 경기 기록이 수정되었습니다.');
    } else {
      matchData.id = Date.now();
      s.matches.push(matchData);
      toast('⚽ 경기 결과가 저장되었습니다!');
    }
  } else {
    matchData.id = Date.now();
    s.matches.push(matchData);
    toast('⚽ 경기 결과가 저장되었습니다!');
  }
  setState(s);
  editingMatchId = null;
  const saveBtn = document.querySelector('#sec-match-input .btn-primary');
  if (saveBtn) saveBtn.textContent = '💾 결과 저장';
  resetMatchForm();
  renderResults();
  renderStandings();
  renderDashboard();
  renderTopScorer();
  renderFinals();
}
function resetMatchForm() {
  ['inp-group','inp-num','inp-staff','inp-ref','inp-ref2','inp-note'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const stageEl = document.getElementById('inp-stage');
  if (stageEl) stageEl.value = 'group';       
  ['inp-home','inp-away'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  ['inp-hscore','inp-ascore','inp-hsub','inp-asub'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '0';
  });
  const d = document.getElementById('inp-date');
  if (d) d.value = new Date().toISOString().slice(0,16);
  editingMatchId = null;
  updateSelects();                              
  const saveBtn = document.querySelector('#sec-match-input .btn-primary');
  if (saveBtn) saveBtn.textContent = '💾 결과 저장';
}
function removeMatch(id) {
  if (!isAdmin() && !ensureAdmin()) return;
  if (!confirm('이 경기 기록을 삭제하시겠습니까?')) return;
  const s = getState();
  s.matches = s.matches.filter(m => m.id !== id);
  setState(s);
  renderResults();
  renderStandings();
  renderDashboard();
  renderFinals();   
  toast('🗑️ 경기 기록이 삭제되었습니다.');
}
function editMatch(id) {
  if (!isAdmin() && !ensureAdmin()) return;
  const s = getState();
  const m = s.matches.find(x => x.id === id);
  if (!m) return toast('경기 정보를 찾을 수 없습니다.');
  editingMatchId = id;
  document.getElementById('inp-group').value = m.group || '';
  document.getElementById('inp-num').value = m.num || '';
  document.getElementById('inp-date').value = m.date || new Date().toISOString().slice(0,16);
  document.getElementById('inp-stage').value = m.stage || 'group';
  updateSelects();  
  document.getElementById('inp-home').value = m.homeId;
  document.getElementById('inp-away').value = m.awayId;
  document.getElementById('inp-hscore').value = m.hs;
  document.getElementById('inp-ascore').value = m.as;
  document.getElementById('inp-hsub').value = m.hsub || 0;
  document.getElementById('inp-asub').value = m.asub || 0;
  document.getElementById('inp-staff').value = m.staff || '';
  document.getElementById('inp-ref').value = m.ref || '';
  document.getElementById('inp-ref2').value = m.ref2 || '';
  document.getElementById('inp-note').value = m.note || '';
  const saveBtn = document.querySelector('#sec-match-input .btn-primary');
  if (saveBtn) saveBtn.textContent = '✅ 수정 완료';
  showSection('match-input');
}
function renderFinals() {
  const s = getState();
  const qualified = getQualifiedTeams();

  const qBox = document.getElementById('finals-qualified-list');
  if (qBox) {
    if (!qualified.length) {
      qBox.innerHTML = '<div class="empty"><div class="ei">🏆</div>아직 조별리그 순위가 확정되지 않았습니다.</div>';
    } else {
      qBox.innerHTML = qualified.map(t => `
        <span class="person-chip" style="background:#fff7e6;color:#b45309;">
          <span style="width:10px;height:10px;border-radius:50%;background:${t.color};display:inline-block;"></span>
          [${t.group}조 1위] ${t.name}
        </span>`).join('');
    }
  }

  const finalMatches = [...s.matches]
    .filter(m => (m.stage || 'group') === 'final')
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const rBox = document.getElementById('finals-results-list');
  if (rBox) {
    if (!finalMatches.length) {
      rBox.innerHTML = '<div class="empty"><div class="ei">🏟️</div>본선 경기 기록이 없습니다.</div>';
    } else {
      rBox.innerHTML = finalMatches.map(m => {
        const home = s.teams.find(t => t.id === m.homeId);
        const away = s.teams.find(t => t.id === m.awayId);
        if (!home || !away) return '';
        const dateStr = m.date ? m.date.replace('T',' ') : '일정 미정';
        return `<div class="match-card">
          <div class="match-header">
            <span class="match-group-badge">본선</span>
            ${m.num ? `<span class="match-round-badge">${m.num}경기</span>` : ''}
            <span class="match-date-text">🗓 ${dateStr}</span>
          </div>
          <div class="match-body">
            <span class="match-team home" style="color:${home.color||'#222'}">${home.name}</span>
            <span class="match-score">${m.hs} : ${m.as}</span>
            <span class="match-team away" style="color:${away.color||'#222'}">${away.name}</span>
          </div>
          <div class="match-meta">
            ${m.staff?`<span>🦺 운영진: ${m.staff}</span>`:''}
            ${m.ref?`<span>🟡 주심: ${m.ref}</span>`:''}
            ${m.ref2?`<span>🟠 부심: ${m.ref2}</span>`:''}
            ${m.note?`<span>📝 ${m.note}</span>`:''}
          </div>
          <div class="match-footer">
            <button class="btn-sm" style="background:#e0f2fe;color:var(--blue);border-radius:6px;border:none;cursor:pointer;margin-right:6px;" onclick="editMatch(${m.id})">📝 수정</button>
            <button class="btn-danger" onclick="removeMatch(${m.id})">🗑 삭제</button>
          </div>
        </div>`;
      }).join('');
    }
  }

  const standings = calcFinalStandings();
  const tbody = document.getElementById('finals-standings-body');
  if (tbody) {
    if (!standings.length) {
      tbody.innerHTML = '<tr><td colspan="11"><div class="empty"><div class="ei">📋</div>본선 진출팀이 없습니다.</div></td></tr>';
    } else {
      tbody.innerHTML = standings.map((t,i) => {
        const cls = i===0?'r1':i===1?'r2':i===2?'r3':'rn';
        const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
        return `<tr>
          <td><span class="rank-badge ${cls}">${medal}</span></td>
          <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${t.color};margin-right:6px;"></span>${t.name}</td>
          <td>${t.group||'-'}</td><td>${t.P}</td>
          <td class="w">${t.W}</td><td class="d">${t.D}</td><td class="l">${t.L}</td>
          <td>${t.GF}</td><td>${t.GA}</td>
          <td style="color:${t.GF-t.GA>=0?'var(--green)':'var(--red)'};">${t.GF-t.GA>0?'+':''}${t.GF-t.GA}</td>
          <td class="pts">${t.PTS}</td>
        </tr>`;
      }).join('');
    }
  }
}
/* ===== 순위 계산 ===== */
function calcStandings(filterGroup) {
  const s = getState();
  const stats = {};
  const targetTeams = filterGroup
    ? s.teams.filter(t => t.group === filterGroup)
    : s.teams;
  targetTeams.forEach(t => {
    stats[t.id] = {
      id: t.id,
      name: t.name,
      group: t.group,
      color: t.color,
      P: 0, W: 0, D: 0, L: 0,
      GF: 0, GA: 0,
      PTS: 0,
      SUB: 0
    };
  });
  s.matches.forEach(m => {
    if ((m.stage || 'group') !== stage) return; 
    if (!stats[m.homeId] || !stats[m.awayId]) return;
    if (filterGroup &&
        (stats[m.homeId].group !== filterGroup || stats[m.awayId].group !== filterGroup)) {
      return;
    }
    const h = stats[m.homeId];
    const a = stats[m.awayId];
    h.P++; a.P++;
    h.GF += m.hs; h.GA += m.as;
    a.GF += m.as; a.GA += m.hs;
    h.SUB += (m.hsub || 0);
    a.SUB += (m.asub || 0);
    if (m.hs > m.as) {
      h.W++; h.PTS += 3; a.L++;
    } else if (m.hs < m.as) {
      a.W++; a.PTS += 3; h.L++;
    } else {
      h.D++; a.D++; h.PTS++; a.PTS++;
    }
  });
  const list = Object.values(stats);
  function headToHead(a, b) {
    const h2h = getState().matches.filter(m =>
      (m.homeId === a.id && m.awayId === b.id) ||
      (m.homeId === b.id && m.awayId === a.id)
    );
    if (!h2h.length) return 0;
    let aPTS = 0, aGD = 0, aGF = 0;
    let bPTS = 0, bGD = 0, bGF = 0;
    h2h.forEach(m => {
      let ah, aa;
      if (m.homeId === a.id) {
        ah = m.hs; aa = m.as;
      } else {
        ah = m.as; aa = m.hs;
      }
      const bh = aa;
      const ba = ah;
      aGF += ah; aGD += (ah - aa);
      bGF += bh; bGD += (bh - ba);
      if (ah > aa) aPTS += 3;
      else if (ah < aa) bPTS += 3;
      else { aPTS += 1; bPTS += 1; }
    });
    if (aPTS !== bPTS) return aPTS > bPTS ? -1 : 1;
    if (aGD  !== bGD ) return aGD  > bGD  ? -1 : 1;
    if (aGF  !== bGF ) return aGF  > bGF  ? -1 : 1;
    return 0;
  }
  list.sort((a, b) => {
    if (b.PTS !== a.PTS) return b.PTS - a.PTS;
    if (b.SUB !== a.SUB) return b.SUB - a.SUB;
    const h2hResult = headToHead(a, b);
    if (h2hResult !== 0) return h2hResult;
    const gdA = a.GF - a.GA;
    const gdB = b.GF - b.GA;
    if (gdB !== gdA) return gdB - gdA;
    if (b.GF !== a.GF) return b.GF - a.GF;
    if (a.name < b.name) return -1;
    if (a.name > b.name) return 1;
    return 0;
  });
  return list;
}

/* ===== 순위표 출력 ===== */
function renderStandings() {
  const filterGroup = document.getElementById('filter-group-standing')?.value || '';
  const data = calcStandings(filterGroup);
  const tbody = document.getElementById('standings-body');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="11"><div class="empty"><div class="ei">📋</div>팀을 등록해 주세요.</div></td></tr>';
    return;
  }
  tbody.innerHTML = data.map((t, i) => {
    const cls = i===0?'r1':i===1?'r2':i===2?'r3':'rn';
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;
    return `<tr>
      <td><span class="rank-badge ${cls}">${medal}</span></td>
      <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${t.color};margin-right:6px;"></span>${t.name}</td>
      <td>${t.group||'-'}</td><td>${t.P}</td>
      <td class="w">${t.W}</td><td class="d">${t.D}</td><td class="l">${t.L}</td>
      <td>${t.GF}</td><td>${t.GA}</td>
      <td style="color:${t.GF-t.GA>=0?'var(--green)':'var(--red)'};">${t.GF-t.GA>0?'+':''}${t.GF-t.GA}</td>
      <td class="pts">${t.PTS}</td>
    </tr>`;
  }).join('');
}

/* ===== 경기 기록 출력 ===== */
function renderResults() {
  const s = getState();
  const filterGroup = document.getElementById('filter-group')?.value || '';
  const filterText = (document.getElementById('filter-team-text')?.value || '').toLowerCase();
  let matches = [...s.matches].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  if (filterGroup) matches = matches.filter(m => m.group === filterGroup);
  if (filterText) {
    matches = matches.filter(m => {
      const h = s.teams.find(t => t.id === m.homeId);
      const a = s.teams.find(t => t.id === m.awayId);
      return (h&&h.name.toLowerCase().includes(filterText)) || (a&&a.name.toLowerCase().includes(filterText));
    });
  }
  document.getElementById('result-count').textContent = matches.length;
  const el = document.getElementById('results-list');
  if (!matches.length) {
    el.innerHTML = '<div class="empty"><div class="ei">🏟️</div>경기 기록이 없습니다.</div>';
    return;
  }
  el.innerHTML = matches.map(m => {
    const home = s.teams.find(t => t.id === m.homeId);
    const away = s.teams.find(t => t.id === m.awayId);
    if (!home || !away) return '';
    const dateStr = m.date ? m.date.replace('T',' ') : '일정 미정';
    return `<div class="match-card">
      <div class="match-header">
        ${m.group ? `<span class="match-group-badge">${m.group}조</span>` : ''}
        ${m.num ? `<span class="match-round-badge">${m.num}경기</span>` : ''}
        <span class="match-date-text">🗓 ${dateStr}</span>
      </div>
      <div class="match-body">
        <span class="match-team home" style="color:${home.color||'#222'}">${home.name}</span>
        <span class="match-score">${m.hs} : ${m.as}</span>
        <span class="match-team away" style="color:${away.color||'#222'}">${away.name}</span>
      </div>
      <div class="match-meta">
        ${m.staff?`<span>🦺 운영진: ${m.staff}</span>`:''}
        ${m.ref?`<span>🟡 주심: ${m.ref}</span>`:''}
        ${m.ref2?`<span>🟠 부심: ${m.ref2}</span>`:''}
        ${m.hsub||m.asub?`<span>🔄 교체: ${home.name} ${m.hsub}회 / ${away.name} ${m.asub}회</span>`:''}
        ${m.note?`<span>📝 ${m.note}</span>`:''}
      </div>
      <div class="match-footer">
        <button class="btn-sm" style="background:#e0f2fe;color:var(--blue);border-radius:6px;border:none;cursor:pointer;margin-right:6px;" onclick="editMatch(${m.id})">📝 수정</button>
        <button class="btn-danger" onclick="removeMatch(${m.id})">🗑 삭제</button>
      </div>
    </div>`;
  }).join('');
}
function clearFilter() {
  document.getElementById('filter-group').value = '';
  document.getElementById('filter-team-text').value = '';
  renderResults();
}
function getQualifiedTeams() {
  const s = getState();
  const groups = [...new Set(s.teams.map(t => t.group).filter(Boolean))].sort();
  const qualified = [];
  groups.forEach(g => {
    const standings = calcStandings(g, 'group');
    if (standings.length) qualified.push(standings[0]); // 조 1위
  });
  return qualified;
}

function calcFinalStandings() {
  const s = getState();
  const qualifiedIds = new Set(getQualifiedTeams().map(t => t.id));
  const stats = {};
  s.teams.filter(t => qualifiedIds.has(t.id)).forEach(t => {
    stats[t.id] = { id:t.id, name:t.name, group:t.group, color:t.color,
      P:0,W:0,D:0,L:0,GF:0,GA:0,PTS:0,SUB:0 };
  });
  s.matches.forEach(m => {
    if ((m.stage||'group') !== 'final') return;
    if (!stats[m.homeId] || !stats[m.awayId]) return;
    const h = stats[m.homeId], a = stats[m.awayId];
    h.P++; a.P++;
    h.GF+=m.hs; h.GA+=m.as; a.GF+=m.as; a.GA+=m.hs;
    h.SUB += (m.hsub||0); a.SUB += (m.asub||0);
    if (m.hs>m.as){h.W++;h.PTS+=3;a.L++;}
    else if (m.hs<m.as){a.W++;a.PTS+=3;h.L++;}
    else {h.D++;a.D++;h.PTS++;a.PTS++;}
  });
  return Object.values(stats).sort((a,b) => {
    if (b.PTS !== a.PTS) return b.PTS - a.PTS;
    const gdA=a.GF-a.GA, gdB=b.GF-b.GA;
    if (gdB!==gdA) return gdB-gdA;
    if (b.GF!==a.GF) return b.GF-a.GF;
    return a.name.localeCompare(b.name);
  });
}
/* ===== 운영진·심판 ===== */
function addPerson() {
  const s = getState();
  const name = document.getElementById('new-person-name').value.trim();
  const role = document.getElementById('new-person-role').value;
  if (!name) return toast('이름을 입력해 주세요.');
  s.staff.push({ id: Date.now(), name, role });
  setState(s);
  document.getElementById('new-person-name').value = '';
  renderStaff();
  toast('✅ ' + name + ' 님이 등록되었습니다!');
}
function removePerson(id) {
  const s = getState();
  s.staff = s.staff.filter(p => p.id !== id);
  setState(s); renderStaff();
}
function renderStaff() {
  const s = getState();
  const roles = { operator:'list-operator', referee:'list-referee', assistant:'list-assistant' };
  Object.entries(roles).forEach(([role, elId]) => {
    const el = document.getElementById(elId);
    const people = s.staff.filter(p => p.role === role);
    if (!people.length) { el.innerHTML = '<span style="color:#bbb;font-size:0.85rem;">등록된 인원이 없습니다.</span>'; return; }
    el.innerHTML = people.map(p =>
      `<span class="person-chip">${p.name}<button class="chip-remove" onclick="removePerson(${p.id})">✕</button></span>`
    ).join('');
  });
}

/* ===== 대시보드 ===== */
function renderDashboard() {
  const s = getState();
  const standings = calcStandings();
  const totalGoals = s.matches.reduce((a,m) => a+m.hs+m.as, 0);
  document.getElementById('stat-row').innerHTML = `
    <div class="stat-card"><div class="stat-val">${s.teams.length}</div><div class="stat-lbl">등록 팀</div></div>
    <div class="stat-card gold"><div class="stat-val">${s.matches.length}</div><div class="stat-lbl">총 경기 수</div></div>
    <div class="stat-card green"><div class="stat-val">${totalGoals}</div><div class="stat-lbl">총 득점</div></div>
    <div class="stat-card"><div class="stat-val">${s.matches.length?( totalGoals/s.matches.length).toFixed(1):0}</div><div class="stat-lbl">경기당 득점</div></div>
  `;
  const recent = [...s.matches].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
  const rm = document.getElementById('recent-matches');
  if (!recent.length) {
    rm.innerHTML='<div class="empty"><div class="ei">📭</div>경기 기록이 없습니다.</div>';
  } else {
    rm.innerHTML = recent.map(m => {
      const h = s.teams.find(t=>t.id===m.homeId), a = s.teams.find(t=>t.id===m.awayId);
      if (!h||!a) return '';
      return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f4ff;">
        <span style="color:var(--gray);font-size:0.78rem;min-width:70px;">${m.date?m.date.slice(0,10):'미정'}</span>
        <span style="flex:1;text-align:right;font-weight:600;">${h.name}</span>
        <span style="font-weight:800;font-size:1.1rem;color:var(--navy);min-width:55px;text-align:center;">${m.hs}:${m.as}</span>
        <span style="flex:1;font-weight:600;">${a.name}</span>
      </div>`;
    }).join('');
  }
  const top = document.getElementById('top-teams');
  if (!standings.length) {
    top.innerHTML='<div class="empty"><div class="ei">🏆</div>팀을 등록해 주세요.</div>';
  } else {
    const medals = ['🥇','🥈','🥉','4위','5위'];
    top.innerHTML = standings.slice(0,5).map((t,i) => `
      <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f4ff;">
        <span style="width:40px;text-align:center;">${medals[i]||''}</span>
        <span style="flex:1;font-weight:700;">${t.name}</span>
        <span style="font-size:0.8rem;color:var(--gray);">${t.P}경기 ${t.W}승${t.D}무${t.L}패</span>
        <span style="font-weight:800;color:var(--blue);">${t.PTS}점</span>
      </div>`).join('');
  }
}

/* ===== 득점왕 ===== */
function renderTopScorer() {
  const s = getState();
  const filterGroup = document.getElementById('filter-group-topscorer')?.value || '';
  const scorerMap = {};
  s.matches.forEach(m => {
    if (filterGroup && m.group !== filterGroup) return;
    if (!m.scorers || !m.scorers.length) return;
    m.scorers.forEach(sc => {
      const key = sc.name + '|' + sc.team;
      if (!scorerMap[key]) {
        scorerMap[key] = { name: sc.name, team: sc.team, goals: 0, matches: 0 };
      }
      scorerMap[key].goals += sc.goals || 0;
      scorerMap[key].matches += 1;
    });
  });
  const list = Object.values(scorerMap).sort((a, b) => {
    if (b.goals !== a.goals) return b.goals - a.goals;
    if (a.matches !== b.matches) return a.matches - b.matches;
    if (a.name < b.name) return -1;
    if (a.name > b.name) return 1;
    return 0;
  });
  const box = document.getElementById('topscorer-list');
  if (!list.length) {
    box.innerHTML = '<div class="empty"><div class="ei">⚽</div>득점 기록이 없습니다.</div>';
    return;
  }
  box.innerHTML = `
    <table>
      <thead>
        <tr>
          <th style="width:60px;">순위</th>
          <th style="text-align:left;padding-left:14px;">선수명</th>
          <th>소속 팀</th>
          <th>득점</th>
          <th>경기 수</th>
        </tr>
      </thead>
      <tbody>
        ${list.map((p, i) => `
          <tr>
            <td>${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</td>
            <td style="text-align:left;padding-left:14px;font-weight:600;">${p.name}</td>
            <td>${p.team}</td>
            <td style="font-weight:800;color:var(--blue);">${p.goals}</td>
            <td>${p.matches}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}
function updateTopScorerGroupFilter() {
  const s = getState();
  const groups = [...new Set(s.teams.map(t => t.group).filter(Boolean))].sort();
  const sel = document.getElementById('filter-group-topscorer');
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '<option value="">전체 조</option>' + groups.map(g =>
    `<option value="${g}">${g}조</option>`).join('');
  sel.value = cur;
}

/* ===== 전체 렌더 ===== */
function renderAll() {
  renderDashboard();
  renderTeams();
  renderStaff();
  renderStandings();
  renderResults();
  updateGroupFilter('filter-group-standing');
  updateGroupFilter('filter-group');
  updateTopScorerGroupFilter();
  updateSelects();
  updateAdminUI();
  renderFinals();  
}

document.addEventListener('DOMContentLoaded', async () => {
  const d = document.getElementById('inp-date');
  if (d && !d.value) {
    d.value = new Date().toISOString().slice(0,16);
  }
  toast('⏳ 데이터를 불러오는 중...');

  updateAdminButton();
});
